<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#7b2cbf"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bgGrad)" stroke="#313244" stroke-width="3"/>

  <!-- Glowing outer contour of mouse -->
  <path d="M128 48 C92 48 76 80 76 130 C76 182 96 208 128 208 C160 208 180 182 180 130 C180 80 164 48 128 48 Z" 
        fill="#181825" stroke="url(#accentGrad)" stroke-width="4.5" filter="url(#neonGlow)"/>

  <!-- Mouse body shape -->
  <path d="M128 50 C94 50 80 82 80 130 C80 180 98 204 128 204 C158 204 176 180 176 130 C176 82 162 50 128 50 Z" 
        fill="#1e1e2e" stroke="#45475a" stroke-width="2"/>

  <!-- Left / Right Button Split Line -->
  <line x1="128" y1="52" x2="128" y2="106" stroke="#45475a" stroke-width="3" stroke-linecap="round"/>

  <!-- Scroll Wheel Slot -->
  <rect x="122" y="72" width="12" height="28" rx="6" fill="#11111b" stroke="#585b70" stroke-width="1.5"/>

  <!-- Illuminated Scroll Wheel -->
  <rect x="124" y="75" width="8" height="20" rx="4" fill="url(#accentGrad)"/>

  <!-- DPI Button -->
  <rect x="124" y="112" width="8" height="12" rx="3" fill="#89b4fa"/>

  <!-- Stylized M-Control 'M' Logo on palm rest -->
  <path d="M106 172 L116 142 L128 158 L140 142 L150 172" 
        fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>
</svg>

